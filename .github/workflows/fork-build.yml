name: fork-build
on:
  workflow_dispatch:
    inputs:
      target:
        description: "Build target platform"
        required: true
        type: choice
        options:
          - macos-arm64
          - macos-x64
          - windows-x64
          - all
        default: all

jobs:
  build-cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Setup Bun
        run: |
          curl -fsSL https://bun.sh/install | bash
          echo "$HOME/.bun/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: bun install

      - name: Build CLI (single platform)
        run: |
          cd packages/opencode
          bun run build --single
        env:
          OPENCODE_VERSION: "1.2.21"
          OPENCODE_RELEASE: "false"

      - uses: actions/upload-artifact@v4
        with:
          name: opencode-cli
          path: packages/opencode/dist

  build-tauri-macos-arm:
    needs: build-cli
    if: inputs.target == 'all' || inputs.target == 'macos-arm64'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup Bun
        run: |
          curl -fsSL https://bun.sh/install | bash
          echo "$HOME/.bun/bin" >> $GITHUB_PATH

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/desktop/src-tauri

      - uses: actions/download-artifact@v4
        with:
          name: opencode-cli
          path: packages/opencode/dist

      - name: Prepare sidecar
        run: |
          cd packages/desktop
          bun ./scripts/predev.ts
        env:
          RUST_TARGET: aarch64-apple-darwin

      - name: Build Tauri
        uses: tauri-apps/tauri-action@v0
        with:
          projectPath: packages/desktop
          args: --target aarch64-apple-darwin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@v4
        with:
          name: opencode-desktop-macos-arm64
          path: |
            packages/desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
            packages/desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app

  build-tauri-macos-x64:
    needs: build-cli
    if: inputs.target == 'all' || inputs.target == 'macos-x64'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup Bun
        run: |
          curl -fsSL https://bun.sh/install | bash
          echo "$HOME/.bun/bin" >> $GITHUB_PATH

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/desktop/src-tauri

      - uses: actions/download-artifact@v4
        with:
          name: opencode-cli
          path: packages/opencode/dist

      - name: Prepare sidecar
        run: |
          cd packages/desktop
          bun ./scripts/predev.ts
        env:
          RUST_TARGET: x86_64-apple-darwin

      - name: Build Tauri
        uses: tauri-apps/tauri-action@v0
        with:
          projectPath: packages/desktop
          args: --target x86_64-apple-darwin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@v4
        with:
          name: opencode-desktop-macos-x64
          path: |
            packages/desktop/src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
            packages/desktop/src-tauri/target/x86_64-apple-darwin/release/bundle/macos/*.app

  build-tauri-windows:
    needs: build-cli
    if: inputs.target == 'all' || inputs.target == 'windows-x64'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup Bun
        run: |
          irm bun.sh/install.ps1 | iex
          echo "$env:USERPROFILE\.bun\bin" >> $env:GITHUB_PATH

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/desktop/src-tauri

      - uses: actions/download-artifact@v4
        with:
          name: opencode-cli
          path: packages/opencode/dist

      - name: Prepare sidecar
        run: |
          cd packages/desktop
          bun ./scripts/predev.ts
        env:
          RUST_TARGET: x86_64-pc-windows-msvc

      - name: Build Tauri
        uses: tauri-apps/tauri-action@v0
        with:
          projectPath: packages/desktop
          args: --target x86_64-pc-windows-msvc
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@v4
        with:
          name: opencode-desktop-windows-x64
          path: |
            packages/desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
            packages/desktop/src-tauri/target/x86_64-pc-windows-msvc/release/*.exe

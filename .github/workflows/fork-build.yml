name: fork-build
on:
  workflow_dispatch:
    inputs:
      target:
        description: "Build target platform"
        required: true
        type: choice
        options:
          - macos-arm64
          - windows-x64
          - both
        default: both

jobs:
  build-cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"

      - name: Install dependencies
        run: bun install

      - name: Build CLI (all platforms)
        run: |
          cd packages/opencode
          bun run build
        env:
          OPENCODE_VERSION: "1.2.21"

      - uses: actions/upload-artifact@v4
        with:
          name: opencode-cli
          path: packages/opencode/dist

  build-tauri-macos-arm:
    needs: build-cli
    if: inputs.target == 'both' || inputs.target == 'macos-arm64'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"

      - name: Install dependencies
        run: bun install

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/desktop/src-tauri

      - uses: actions/download-artifact@v4
        with:
          name: opencode-cli
          path: packages/opencode/dist

      - name: Prepare sidecar and build frontend
        run: |
          cd packages/desktop
          mkdir -p src-tauri/sidecars
          cp ../opencode/dist/opencode-darwin-arm64/bin/opencode src-tauri/sidecars/opencode-cli-aarch64-apple-darwin
          bun x vite build
        env:
          RUST_TARGET: aarch64-apple-darwin

      - name: Modify tauri config to skip beforeBuildCommand
        run: |
          cd packages/desktop/src-tauri
          sed -i.bak 's/"beforeBuildCommand": "bun run build"/"beforeBuildCommand": "echo skip"/g' tauri.conf.json

      - name: Build Tauri
        uses: tauri-apps/tauri-action@v0
        with:
          projectPath: packages/desktop
          args: --target aarch64-apple-darwin --config src-tauri/tauri.conf.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@v4
        with:
          name: opencode-desktop-macos-arm64
          path: |
            packages/desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
            packages/desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app

  build-tauri-windows:
    needs: build-cli
    if: inputs.target == 'both' || inputs.target == 'windows-x64'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"

      - name: Install dependencies
        run: bun install

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/desktop/src-tauri

      - uses: actions/download-artifact@v4
        with:
          name: opencode-cli
          path: packages/opencode/dist

      - name: Prepare sidecar and build frontend
        run: |
          cd packages/desktop
          mkdir -p src-tauri/sidecars
          cp ../opencode/dist/opencode-windows-x64-baseline/bin/opencode.exe src-tauri/sidecars/opencode-cli-x86_64-pc-windows-msvc.exe
          bun x vite build
        env:
          RUST_TARGET: x86_64-pc-windows-msvc

      - name: Modify tauri config to skip beforeBuildCommand
        shell: bash
        run: |
          cd packages/desktop/src-tauri
          sed -i 's/"beforeBuildCommand": "bun run build"/"beforeBuildCommand": "echo skip"/g' tauri.conf.json

      - name: Build Tauri
        uses: tauri-apps/tauri-action@v0
        with:
          projectPath: packages/desktop
          args: --target x86_64-pc-windows-msvc --config src-tauri/tauri.conf.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@v4
        with:
          name: opencode-desktop-windows-x64
          path: |
            packages/desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
            packages/desktop/src-tauri/target/x86_64-pc-windows-msvc/release/*.exe
